name: Watch Turbovec Version

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch-version:
    name: Check crates.io release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Turbovec version
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const USER_AGENT = 'washu/ruby_llm-turbovec version-check (sal.scotto@gmail.com)';

            function parseVersion(version) {
              return version
                .replace(/^v/, '')
                .split('-')[0]
                .split('.')
                .map((part) => parseInt(part, 10) || 0);
            }

            function compareVersions(left, right) {
              const l = parseVersion(left);
              const r = parseVersion(right);

              for (let i = 0; i < Math.max(l.length, r.length, 3); i++) {
                const lv = l[i] || 0;
                const rv = r[i] || 0;

                if (lv !== rv) return lv - rv;
              }

              return 0;
            }

            async function fetchText(url) {
              const response = await fetch(url, {
                headers: {
                  'Accept': 'text/plain, application/json',
                  'User-Agent': USER_AGENT,
                },
              });

              if (!response.ok) {
                const body = await response.text().catch(() => '');
                throw new Error(
                  `Failed to query crates.io index: ${response.status} ${response.statusText}\n` +
                  `URL: ${url}\n` +
                  `Body: ${body.slice(0, 1000)}`
                );
              }

              return response.text();
            }

            const cargoLockPath = 'ext/ruby_llm/turbovec/Cargo.lock';
            const cargoLock = fs.readFileSync(cargoLockPath, 'utf8');

            const match = cargoLock.match(/name = "turbovec"\s+version = "([^"]+)"/);

            if (!match) {
              throw new Error(`Unable to find turbovec in ${cargoLockPath}`);
            }

            const lockedVersion = match[1];

            // crates.io sparse index path for "turbovec":
            // crate names with 8+ chars use first 2 chars / next 2 chars / crate name
            const indexUrl = 'https://index.crates.io/tu/rb/turbovec';
            const indexBody = await fetchText(indexUrl);

            const versions = indexBody
              .trim()
              .split('\n')
              .filter(Boolean)
              .map((line) => JSON.parse(line))
              .filter((entry) => entry.name === 'turbovec')
              .filter((entry) => !entry.yanked)
              .map((entry) => entry.vers)
              .sort(compareVersions);

            if (versions.length === 0) {
              throw new Error('No non-yanked turbovec versions found in crates.io index');
            }

            const latestVersion = versions[versions.length - 1];

            if (compareVersions(latestVersion, lockedVersion) <= 0) {
              core.info(`turbovec is current: locked=${lockedVersion}, latest=${latestVersion}`);
              return;
            }

            const title = `turbovec ${latestVersion} is available`;

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            if (existing.some((issue) => issue.title === title)) {
              core.info(`Issue already exists for ${latestVersion}`);
              return;
            }

            const body = [
              `A newer \`turbovec\` release is available on crates.io.`,
              '',
              `- Locked version: \`${lockedVersion}\``,
              `- Latest version: \`${latestVersion}\``,
              `- Dependency range: \`turbovec = "0.8"\``,
              '',
              'Please update the Rust dependency, rebuild the native extension, and run the test suite to keep the Ruby gem in sync.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });

            core.notice(`Created issue: ${title}`);
