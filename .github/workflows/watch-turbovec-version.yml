name: Watch Turbovec Version

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch-version:
    name: Check crates.io release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Turbovec version
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            function parseVersion(version) {
              return version.split('.').map((part) => parseInt(part, 10));
            }

            function compareVersions(left, right) {
              const [lMajor, lMinor, lPatch] = parseVersion(left);
              const [rMajor, rMinor, rPatch] = parseVersion(right);

              if (lMajor !== rMajor) return lMajor - rMajor;
              if (lMinor !== rMinor) return lMinor - rMinor;
              return lPatch - rPatch;
            }

            const cargoLock = fs.readFileSync('ext/ruby_llm/turbovec/Cargo.lock', 'utf8');
            const match = cargoLock.match(/name = "turbovec"\nversion = "([^"]+)"/);

            if (!match) {
              throw new Error('Unable to find turbovec in ext/ruby_llm/turbovec/Cargo.lock');
            }

            const lockedVersion = match[1];
            const response = await fetch('https://crates.io/api/v1/crates/turbovec',{
              headers: {
                'User-Agent': 'washu/ruby_llm-turbovec version-check (sal.scotto@gmail.com)'}
            });

            if (!response.ok) {
              throw new Error(`Failed to query crates.io: ${response.status} ${response.statusText}`);
            }

            const payload = await response.json();
            const latestVersion = payload.crate.max_version;

            if (compareVersions(latestVersion, lockedVersion) <= 0) {
              core.info(`turbovec is current: locked=${lockedVersion}, latest=${latestVersion}`);
              return;
            }

            const title = `turbovec ${latestVersion} is available`;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            if (existing.some((issue) => issue.title === title)) {
              core.info(`Issue already exists for ${latestVersion}`);
              return;
            }

            const body = [
              `A newer \`turbovec\` release is available on crates.io.`,
              '',
              `- Locked version: \`${lockedVersion}\``,
              `- Latest version: \`${latestVersion}\``,
              `- Dependency range: \`turbovec = \"0.8\"\``,
              '',
              'Please update the Rust dependency, rebuild the native extension, and run the test suite to keep the Ruby gem in sync.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });

            core.notice(`Created issue: ${title}`);

